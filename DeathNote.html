<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEATH NOTE · Birthday Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Caveat:wght@600;700&family=Special+Elite&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:'Cormorant Garamond',Georgia,serif;color:#ddd;user-select:none;-webkit-font-smoothing:antialiased}
input,textarea{user-select:text}
html{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M4 4 L4 22 L9 17 L13 26 L16 24 L12 16 L21 16 Z' fill='%23c1121f' stroke='%23000' stroke-width='1.2' stroke-linejoin='round'/></svg>") 4 4,auto}
button,[data-action]{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M4 4 L4 22 L9 17 L13 26 L16 24 L12 16 L21 16 Z' fill='%23ff3b3b' stroke='%23ffe0e0' stroke-width='1.2' stroke-linejoin='round'/></svg>") 4 4,pointer}
input,textarea{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><line x1='7' y1='7' x2='17' y2='17' stroke='%23c1121f' stroke-width='1.6'/><line x1='17' y1='7' x2='7' y2='17' stroke='%23c1121f' stroke-width='1.6'/></svg>") 12 12,text}

#scene{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 45%,#1a0606 0%,#0a0202 45%,#000 100%)}
#scene::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(92deg,rgba(60,30,15,.08) 0 3px,rgba(0,0,0,0) 3px 9px);opacity:.5}
#scene::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(120,20,20,.14),transparent 55%);animation:fogPulse 12s ease-in-out infinite}
@keyframes fogPulse{0%,100%{opacity:.5;transform:translate(0,0) scale(1)}50%{opacity:1;transform:translate(2%,-1%) scale(1.08)}}
#embers,#confetti{position:fixed;inset:0;pointer-events:none}
#embers{z-index:1}#confetti{z-index:3}
#vignette{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,.78) 88%,#000 100%)}
#flash{position:fixed;inset:0;z-index:500;pointer-events:none;background:radial-gradient(circle,rgba(255,60,60,.95),rgba(120,0,0,.4) 40%,transparent 70%);opacity:0;transition:opacity .1s}
#flash.on{opacity:1}

#notify{position:fixed;top:-100px;left:50%;transform:translateX(-50%);z-index:850;padding:14px 26px;background:linear-gradient(180deg,#1a0808,#0a0202);border:1px solid #c1121f;border-radius:6px;color:#f4e8c8;font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;text-transform:uppercase;box-shadow:0 0 50px rgba(200,20,20,.7),0 10px 30px rgba(0,0,0,.9);transition:top .8s cubic-bezier(.2,.9,.3,1.2);max-width:90vw;text-align:center;display:flex;align-items:center;gap:12px}
#notify.on{top:24px}
#notify .ico{font-size:20px;animation:bellRing 1.5s ease-in-out infinite}
@keyframes bellRing{0%,100%{transform:rotate(0)}20%{transform:rotate(15deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-5deg)}}

#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(30px);z-index:600;padding:14px 28px;background:linear-gradient(180deg,#1a0808,#0a0202);border:1px solid #c1121f;border-radius:4px;color:#f4e8c8;font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;text-transform:uppercase;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;box-shadow:0 0 40px rgba(200,20,20,.5),0 10px 30px rgba(0,0,0,.8);max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:#ffaa00;color:#ffdd99;box-shadow:0 0 40px rgba(255,180,40,.5)}

#langBtn{position:fixed;top:16px;left:16px;z-index:900;padding:10px 16px;background:rgba(0,0,0,.75);border:1px solid #4a1010;color:#c1121f;font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;border-radius:20px;backdrop-filter:blur(6px);transition:.3s;display:flex;align-items:center;gap:6px}
#langBtn:hover{background:#5a0a0a;color:#fff;border-color:#ff2b2b;box-shadow:0 0 22px rgba(200,0,0,.7)}
#langMenu{position:fixed;top:60px;left:16px;z-index:901;background:linear-gradient(180deg,#1a0808,#0a0202);border:1px solid #4a1010;border-radius:6px;overflow:hidden;display:none;box-shadow:0 10px 40px rgba(0,0,0,.9);min-width:180px}
#langMenu.on{display:block}
#langMenu button{display:block;width:100%;padding:12px 20px;background:transparent;border:none;border-bottom:1px solid rgba(120,20,20,.3);color:#c9a08a;font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;text-align:left;transition:.25s;text-transform:uppercase}
#langMenu button:last-child{border-bottom:none}
#langMenu button:hover{background:#5a0a0a;color:#fff;padding-left:26px}
#langMenu button.active{background:#5a0a0a;color:#f4e8c8}
#mute{position:fixed;top:16px;right:16px;z-index:900;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.75);border:1px solid #4a1010;color:#c1121f;font-size:15px;padding:0;transition:.3s;backdrop-filter:blur(6px)}
#mute:hover{background:#5a0a0a;color:#fff;border-color:#ff2b2b;box-shadow:0 0 22px rgba(200,0,0,.7)}

#viz{position:fixed;bottom:0;left:0;right:0;height:60px;z-index:5;pointer-events:none;opacity:.5}

#opening{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;transition:opacity 1s ease}
#opening.hide{opacity:0;pointer-events:none}
.op-title{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(44px,11vw,160px);color:#f6f6f6;letter-spacing:22px;padding-left:22px;text-transform:uppercase;text-align:center;text-shadow:0 0 18px rgba(255,255,255,.28),0 0 55px rgba(200,0,0,.7),0 0 130px rgba(150,0,0,.55);animation:opZoom 3.5s ease forwards}
@keyframes opZoom{0%{opacity:0;letter-spacing:80px;filter:blur(24px);padding-left:80px}35%{opacity:1;filter:blur(0)}75%{letter-spacing:14px;padding-left:14px}100%{opacity:1;letter-spacing:12px;padding-left:12px}}
.op-sub{position:absolute;bottom:12%;font-family:'Cinzel',serif;font-size:clamp(9px,1.2vw,12px);letter-spacing:14px;padding-left:14px;color:#555;text-transform:uppercase;text-align:center;animation:opSub 3.5s ease forwards}
@keyframes opSub{0%,45%{opacity:0;transform:translateY(10px)}75%{opacity:1;transform:translateY(0)}100%{opacity:1}}

#stage{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;perspective:2600px;perspective-origin:50% 45%;opacity:0;transition:opacity 1.5s ease}
#stage.ready{opacity:1}
.book{--book-w:min(1180px,94vw,122vh);position:relative;width:var(--book-w);height:calc(var(--book-w) / 1.42);transform-style:preserve-3d;transform:translateX(-25%) rotateX(6deg);transition:transform 1.8s cubic-bezier(.55,.05,.25,1)}
.book.opened{transform:translateX(0) rotateX(0)}
.book::after{content:'';position:absolute;left:6%;right:6%;bottom:-10%;height:16%;background:radial-gradient(ellipse at center,rgba(0,0,0,.95),transparent 72%);filter:blur(26px);z-index:-1;opacity:.55;transition:opacity .8s}
.book.opened::after{opacity:1}

.page{position:absolute;top:0;width:50%;height:100%;overflow:hidden;color:#1a1510;background:radial-gradient(ellipse at 12% 8%,rgba(150,110,50,.20),transparent 42%),radial-gradient(ellipse at 88% 92%,rgba(120,80,30,.18),transparent 48%),linear-gradient(180deg,#f6ebd2 0%,#eee0bd 55%,#e3d1a8 100%);box-shadow:inset 0 0 110px rgba(100,70,25,.22),inset 0 0 30px rgba(0,0,0,.14);opacity:0;pointer-events:none;transition:opacity .5s ease}
.book.opened .page{opacity:1;pointer-events:auto}
.page.left{left:0;border-radius:4px 0 0 4px;border-right:1px solid rgba(70,40,15,.4);z-index:6;transition:opacity .5s ease .65s}
.page.right{right:0;border-radius:0 4px 4px 0;border-left:1px solid rgba(70,40,15,.4);z-index:5;transition:opacity .5s ease .9s}
.page::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(to bottom,transparent 0 33px,rgba(160,130,80,.22) 33px 34px);background-position:0 76px;pointer-events:none}
.page.left::after{content:'';position:absolute;top:0;bottom:0;right:0;width:70px;background:linear-gradient(to left,rgba(60,30,10,.30),transparent);pointer-events:none}
.page.right::after{content:'';position:absolute;top:0;bottom:0;left:0;width:70px;background:linear-gradient(to right,rgba(60,30,10,.30),transparent);pointer-events:none}
.page .content{position:absolute;top:0;bottom:0;padding:56px 46px 60px;overflow-y:auto;overflow-x:hidden}
.page .content::-webkit-scrollbar{width:6px}
.page .content::-webkit-scrollbar-track{background:transparent}
.page .content::-webkit-scrollbar-thumb{background:rgba(120,90,50,.4);border-radius:3px}
.page.left .content{left:0;right:70px;padding-left:30px;padding-right:36px;border-right:1.5px solid rgba(180,30,30,.55)}
.page.right .content{left:70px;right:0;padding-left:36px;padding-right:30px;border-left:1.5px solid rgba(180,30,30,.55)}

.cover{position:absolute;top:0;right:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transform:rotateY(0deg);transition:transform 1.8s cubic-bezier(.55,.05,.25,1);z-index:40;border-radius:0 4px 4px 0;cursor:pointer}
.book.opened .cover{transform:rotateY(-180deg);animation:coverDisappear 0s 1.6s forwards}
@keyframes coverDisappear{to{visibility:hidden;opacity:0}}
.cover-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:0 4px 4px 0}
.cover-front{background:#080808;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.014) 0 2px,rgba(0,0,0,0) 2px 5px),repeating-linear-gradient(65deg,rgba(255,255,255,.008) 0 3px,rgba(0,0,0,0) 3px 7px),radial-gradient(circle at 30% 18%,#1c1414 0%,#0a0606 55%,#000 100%);box-shadow:inset 0 0 90px rgba(0,0,0,.9),inset 4px 0 12px rgba(0,0,0,.7),inset 0 0 0 1px rgba(60,40,20,.32),0 0 60px rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9%}
.cover-front::before{content:'';position:absolute;inset:4%;border:1px solid rgba(90,70,40,.25);border-radius:2px;pointer-events:none}
.cover-front::after{content:'';position:absolute;inset:4.6%;border:.5px solid rgba(90,70,40,.14);border-radius:2px;pointer-events:none}
.cover-inner{display:flex;flex-direction:column;align-items:center;width:100%}
.cover-title{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(18px,3.2vw,44px);color:#f6f6f4;letter-spacing:0.17em;padding-left:0.17em;line-height:1;text-align:center;white-space:nowrap;max-width:100%;text-shadow:0 1px 0 rgba(255,255,255,.22),0 0 18px rgba(255,255,255,.14)}
.cover-rule{width:52%;height:1px;background:rgba(240,240,235,.5);margin:clamp(14px,3vh,28px) 0 clamp(12px,2.6vh,24px)}
.cover-sub{font-family:'Cinzel',serif;font-size:clamp(7px,.9vw,11px);letter-spacing:10px;padding-left:10px;color:rgba(220,220,215,.6);text-transform:uppercase;text-align:center;white-space:nowrap}
.cover-orn{margin-top:clamp(14px,3vh,32px);font-family:'Cinzel',serif;font-size:clamp(10px,1.2vw,14px);letter-spacing:16px;padding-left:16px;color:rgba(200,190,160,.4);white-space:nowrap}
.cover-prompt{position:absolute;bottom:6.5%;left:50%;transform:translateX(-50%);font-family:'Cinzel',serif;font-size:clamp(7px,.9vw,11px);letter-spacing:8px;padding-left:8px;color:rgba(180,160,120,.55);text-transform:uppercase;white-space:nowrap;animation:promptPulse 2.6s ease-in-out infinite}
@keyframes promptPulse{0%,100%{opacity:.35}50%{opacity:1}}
.cover-back{transform:rotateY(180deg);border-radius:4px 0 0 4px;background:repeating-linear-gradient(45deg,rgba(130,90,40,.06) 0 4px,rgba(0,0,0,0) 4px 10px),radial-gradient(circle at 30% 30%,#ead9b0 0%,#d8c48a 100%);box-shadow:inset 0 0 110px rgba(120,80,30,.45)}

.flipper{position:absolute;top:0;right:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transform:rotateY(0deg);z-index:35;display:none;pointer-events:none}
.flipper.active{display:block}
.flipper-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:radial-gradient(ellipse at 20% 12%,rgba(160,120,60,.18),transparent 55%),radial-gradient(ellipse at 78% 88%,rgba(130,90,40,.15),transparent 55%),linear-gradient(180deg,#f3e9cf 0%,#e4d5b0 100%);box-shadow:inset 0 0 70px rgba(100,70,25,.22)}
.flipper-face::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(to bottom,transparent 0 33px,rgba(160,130,80,.22) 33px 34px);background-position:0 76px}
.flipper-face.front{border-radius:0 4px 4px 0}
.flipper-face.back{transform:rotateY(180deg);border-radius:4px 0 0 4px}
.flipper-face.front::after{content:'';position:absolute;top:0;bottom:0;left:0;width:80px;background:linear-gradient(to right,rgba(60,30,10,.30),transparent)}
.flipper-face.back::after{content:'';position:absolute;top:0;bottom:0;right:0;width:80px;background:linear-gradient(to left,rgba(60,30,10,.30),transparent)}
.flipper-content{position:absolute;top:0;bottom:0;padding:56px 46px 60px;overflow:hidden}
.flipper-face.front .flipper-content{left:70px;right:0;padding-right:30px;padding-left:36px;border-left:1.5px solid rgba(180,30,30,.55)}
.flipper-face.back .flipper-content{left:0;right:70px;padding-left:30px;padding-right:36px;border-right:1.5px solid rgba(180,30,30,.55)}

.page-title{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(14px,1.65vw,21px);letter-spacing:6px;color:#5a0a0a;margin-bottom:4px;text-transform:uppercase}
.page-chapter{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(10px,.95vw,13px);color:#8a6a3a;letter-spacing:4px;margin-bottom:22px;border-bottom:1px solid #8a6a3a;padding-bottom:7px}
.rule{font-family:'Cormorant Garamond',serif;font-size:clamp(12px,1.08vw,15px);line-height:1.85;color:#221a10;margin-bottom:10px;padding-left:4px}
.rule b{font-family:'Cinzel',serif;font-size:.82em;color:#5a0a0a;letter-spacing:2px;margin-right:6px}
.quote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(12px,1.2vw,16px);line-height:1.9;color:#4a3520;border-left:2px solid rgba(120,30,30,.35);padding-left:14px;margin:18px 0;transition:opacity .6s}
.deco-skull{font-family:'Special Elite',monospace;font-size:clamp(8px,.92vw,11px);line-height:1.15;color:#5a0a0a;white-space:pre;text-align:center;margin:18px 0;opacity:.82}
.counter{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;color:#8a6a3a;margin:8px 0;padding-bottom:6px;border-bottom:1px dashed rgba(140,110,70,.5)}
.counter b{color:#5a0a0a;font-size:12px}

.field-label{display:block;font-family:'Cinzel',serif;font-size:10px;letter-spacing:5px;color:#5a0a0a;margin-bottom:8px;text-transform:uppercase}
.input{width:100%;background:transparent;border:none;border-bottom:1.5px solid rgba(120,90,50,.55);font-family:'Caveat',cursive;font-weight:600;font-size:clamp(20px,2.2vw,28px);color:#1a0f08;padding:3px 2px 5px;outline:none;transition:border-color .3s}
.input::placeholder{color:rgba(120,90,50,.5);font-family:'Special Elite',monospace;font-weight:400;font-size:11px;letter-spacing:1px}
.input:focus{border-bottom-color:#5a0a0a}
.input:disabled{opacity:.6}
.row{margin-bottom:20px}
input[type="date"].input{font-family:'Cinzel',serif;font-size:clamp(14px,1.6vw,20px);letter-spacing:3px;padding:6px 2px;color-scheme:light}
input[type="date"].input::-webkit-calendar-picker-indicator{filter:invert(15%) sepia(80%) saturate(3000%) hue-rotate(345deg);cursor:pointer;opacity:.75}
textarea.input{font-size:clamp(14px,1.6vw,18px);resize:none;min-height:48px;font-family:'Caveat',cursive;line-height:1.3}

.avatar-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;max-height:80px;overflow-y:auto;padding:4px 2px}
.avatar-opt{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:17px;background:rgba(255,255,255,.35);border:1.5px solid rgba(120,90,50,.4);border-radius:50%;transition:.25s;padding:0;filter:grayscale(.3)}
.avatar-opt:hover{transform:scale(1.1);border-color:rgba(180,30,30,.6);filter:grayscale(0)}
.avatar-opt.active{background:rgba(90,10,10,.9);border-color:#c1121f;transform:scale(1.12);box-shadow:0 0 16px rgba(200,20,20,.7);filter:grayscale(0)}

.ritual-btn{position:relative;width:100%;padding:13px;background:linear-gradient(180deg,#1a1010,#0a0505);color:#ecdfb8;border:1px solid #4a1a1a;font-family:'Cinzel',serif;letter-spacing:8px;padding-left:8px;font-size:11px;text-transform:uppercase;transition:.35s;margin-top:8px;overflow:hidden;user-select:none;touch-action:none}
.ritual-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(220,40,40,.3),transparent);transform:translateX(-100%);transition:transform .7s}
.ritual-btn:hover::before{transform:translateX(100%)}
.ritual-btn:hover{background:linear-gradient(180deg,#5a0a0a,#240303);border-color:#ff2b2b;letter-spacing:11px;padding-left:11px;box-shadow:0 0 28px rgba(180,0,0,.7)}
.ritual-btn .fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,rgba(180,20,20,.6),rgba(255,60,60,.8));transition:width .05s linear;pointer-events:none}
.ritual-btn.charging .fill{z-index:1}
.ritual-btn.charging{letter-spacing:14px;padding-left:14px;color:#fff;border-color:#ff2b2b}
.ritual-btn .label{position:relative;z-index:2}
.ritual-btn:disabled{background:#262626;color:#666;letter-spacing:8px;padding-left:8px;box-shadow:none;border-color:#2f2f2f}

#nameDisplay{position:relative;font-family:'Caveat',cursive;font-weight:600;font-size:clamp(26px,3.4vw,48px);color:#0c0703;min-height:46px;line-height:1.15;padding:3px 0 3px 4px;word-break:break-word}
#nameDisplay span{opacity:0;display:inline-block;transform:translateY(-5px) rotate(-3deg);animation:inkIn .32s cubic-bezier(.2,.9,.3,1.6) forwards}
@keyframes inkIn{to{opacity:1;transform:translateY(0) rotate(0)}}

#result{margin-top:16px;display:none;border-left:4px solid #5a0a0a;padding:11px 14px;background:rgba(120,0,0,.08)}
#result.on{display:block;animation:resultIn .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes resultIn{from{opacity:0;transform:translateX(-22px) scale(.96)}to{opacity:1;transform:translateX(0) scale(1)}}
#resultText{font-family:'Cinzel',serif;font-size:13px;letter-spacing:2px;color:#5a0a0a;line-height:1.6}
.wish-line{margin-top:6px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;color:#7a5a3a}

.hero{position:relative;padding:14px 16px;margin:8px 0 14px;border:1px solid rgba(140,30,30,.4);border-radius:5px;background:linear-gradient(180deg,rgba(120,20,20,.08),rgba(120,20,20,.02));overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#c1121f,transparent);animation:heroShine 3s linear infinite}
@keyframes heroShine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.hero-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:4px;color:#8a6a3a;text-transform:uppercase;margin-bottom:3px}
.hero-name{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(20px,2.4vw,28px);color:#5a0a0a;line-height:1;margin-bottom:8px}
.hero-timer{display:flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;font-weight:700;margin-bottom:6px}
.hero-timer .hcell{display:inline-flex;flex-direction:column;align-items:center;background:rgba(90,10,10,.92);color:#fff;padding:4px 8px;border-radius:3px;min-width:38px;line-height:1}
.hero-timer .hcell .hnum{font-size:clamp(14px,1.6vw,18px)}
.hero-timer .hcell .hlbl{font-family:'Cinzel',serif;font-size:7px;letter-spacing:1px;color:rgba(255,220,220,.7);margin-top:3px}
.hero-timer .hsep{color:#5a0a0a;font-weight:700;font-size:clamp(14px,1.6vw,18px)}
.hero-sub{font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;color:#7a6a4a;text-transform:uppercase}

/* ============ STORAGE ============ */
var memoryStore = [];
var storageWorks = true;
function testStorage(){
  try { localStorage.setItem('__t__','1'); localStorage.removeItem('__t__'); return true; }
  catch(e){ return false; }
}
function loadEntries(){
  if (storageWorks){
    try { var raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
    catch(e){ storageWorks = false; }
  }
  return memoryStore.slice();
}
function saveEntries(arr){
  memoryStore = arr.slice();
  if (storageWorks){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); return true; }
    catch(e){ storageWorks = false; showToast(t('storageBlocked'), true); return false; }
  }
  return false;
}

/* ============ TOAST + NOTIFY ============ */
var toastTimer = null;
function showToast(msg, isError){
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.toggle('err', !!isError);
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 2600);
}
function showNotify(msg){
  var el = document.getElementById('notify');
  var txt = document.getElementById('notifyText');
  if (!el || !txt) return;
  txt.textContent = msg;
  el.classList.add('on');
  setTimeout(function(){ el.classList.remove('on'); }, 7000);
}

/* ============ DATE + MOON ============ */
function isValidDateStr(s){
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  var p = s.split('-').map(Number), y = p[0], m = p[1], d = p[2];
  if (m < 1 || m > 12 || d < 1 || d > 31 || y < 1900 || y > 2200) return false;
  var dt = new Date(y, m-1, d);
  return dt.getFullYear() === y && dt.getMonth() === m-1 && dt.getDate() === d;
}
function getNextBirthdayInfo(s){
  var p = s.split('-').map(Number), y = p[0], m = p[1], d = p[2];
  var now = new Date();
  var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var thisYear = new Date(now.getFullYear(), m-1, d);
  var isToday = thisYear.getTime() === todayStart.getTime();
  var target;
  if (isToday) target = todayStart;
  else if (thisYear < todayStart) target = new Date(now.getFullYear()+1, m-1, d);
  else target = thisYear;
  var ageTurning = target.getFullYear() - y;
  var diffMs = Math.max(0, target - now);
  return {
    isToday: isToday, ageTurning: ageTurning,
    days: Math.floor(diffMs/86400000),
    hours: Math.floor((diffMs%86400000)/3600000),
    minutes: Math.floor((diffMs%3600000)/60000),
    seconds: Math.floor((diffMs%60000)/1000)
  };
}
function ageInSeconds(bdayStr){
  var p = bdayStr.split('-').map(Number);
  var birth = new Date(p[0], p[1]-1, p[2]);
  return Math.max(0, Math.floor((Date.now() - birth) / 1000));
}
function daysAlive(bdayStr){
  return Math.floor(ageInSeconds(bdayStr) / 86400);
}
function formatDate(s){
  var p = s.split('-').map(Number);
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return p[2] + ' ' + months[p[1]-1] + ' ' + p[0];
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function getMoonPhase(date){
  var knownNew = Date.UTC(2000, 0, 6, 18, 14);
  var synodic = 29.530588853 * 86400000;
  var diff = date.getTime() - knownNew;
  var phase = ((diff % synodic) / synodic + 1) % 1;
  return phase;
}
function getMoonEmojiAndName(phase){
  if (phase < 0.03 || phase > 0.97) return {emoji:'🌑', name:'New Moon'};
  if (phase < 0.22) return {emoji:'🌒', name:'Waxing Crescent'};
  if (phase < 0.28) return {emoji:'🌓', name:'First Quarter'};
  if (phase < 0.47) return {emoji:'🌔', name:'Waxing Gibbous'};
  if (phase < 0.53) return {emoji:'🌕', name:'Full Moon'};
  if (phase < 0.72) return {emoji:'🌖', name:'Waning Gibbous'};
  if (phase < 0.78) return {emoji:'🌗', name:'Last Quarter'};
  return {emoji:'🌘', name:'Waning Crescent'};
}

    svg += '<circle cx="'+points[j][0]+'" cy="'+points[j][1]+'" r="2.5" fill="#5a0a0a"/>';
  }
  svg += '</svg>';
  return '<span class="constellation">' + svg + '</span>';
}

function renderSpread(idx){
  if (idx < 0 || idx >= SPREADS.length) return;
  var s = SPREADS[idx];
  leftCont.innerHTML = s.left;
  rightCont.innerHTML = s.right;
  if (idx === 1){
    var btns = rightCont.querySelectorAll('.avatar-opt');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-emoji') === selectedAvatar);
  }
  if (idx === 2) renderList();
  if (idx === 3) renderAchievements();

function openBook(){
  if (isOpening || currentSpread !== -1) return;
  isOpening = true;
  try { getAudio(); startAmbient(); spineCreak(); } catch(e){}
  book.classList.add('opened');
  if (coverPrompt) coverPrompt.style.display = 'none';
  setTimeout(function(){
    isOpening = false;
    currentSpread = 0;
    renderSpread(0);
    updateDots();
    updateNav();
    setTimeout(checkUpcomingBirthdays, 900);
    startWhispers();
  }, 1000);
}

function flipTo(newIdx, direction){
  if (isFlipping) return;
  if (newIdx < 0 || newIdx >= SPREADS.length) return;
  if (newIdx === currentSpread) return;
  if (currentSpread < 0) return;
  isFlipping = true;
  updateNav();
  try { pageFlipSound(); } catch(e){}
  var cur = SPREADS[currentSpread], nxt = SPREADS[newIdx];
  if (!cur || !nxt){ isFlipping = false; updateNav(); return; }

  if (direction === 'fwd'){
    rightCont.innerHTML = nxt.right;
    if (newIdx === 1){
      var btns1 = rightCont.querySelectorAll('.avatar-opt');
      for (var i1 = 0; i1 < btns1.length; i1++) btns1[i1].classList.toggle('active', btns1[i1].getAttribute('data-emoji') === selectedAvatar);
    }
    if (newIdx === 2) renderList();
    if (newIdx === 3) renderAchievements();
    bindFormInputs();
    flipFront.innerHTML = cur.right;
    flipBack.innerHTML = nxt.left;
    flipper.style.transition = 'none';
    flipper.style.transform = 'rotateY(0deg)';
    flipper.classList.add('active');
    void flipper.offsetWidth;
    flipper.style.transition = 'transform 1.15s cubic-bezier(.55,.05,.25,1)';
    flipper.style.transform = 'rotateY(-180deg)';
    setTimeout(function(){
      leftCont.innerHTML = nxt.left;
      if (newIdx === 2) renderList();
      if (newIdx === 3) renderAchievements();
      bindFormInputs();
      currentSpread = newIdx;
      updateDots();
      flipper.classList.remove('active');
      flipper.style.transition = 'none';
      flipper.style.transform = 'rotateY(0deg)';
      isFlipping = false;
      updateNav();
      startQuoteRotation();
      if (newIdx === 2) startLiveTick(); else stopLiveTick();
    }, 1200);
  } else {
    leftCont.innerHTML = nxt.left;
    if (newIdx === 2) renderList();
    if (newIdx === 3) renderAchievements();
    bindFormInputs();
    flipFront.innerHTML = nxt.right;
    flipBack.innerHTML = cur.left;
    flipper.style.transition = 'none';
    flipper.style.transform = 'rotateY(-180deg)';
    flipper.classList.add('active');
    void flipper.offsetWidth;
    flipper.style.transition = 'transform 1.15s cubic-bezier(.55,.05,.25,1)';
    flipper.style.transform = 'rotateY(0deg)';
    setTimeout(function(){
      rightCont.innerHTML = nxt.right;
      if (newIdx === 1){
        var btns2 = rightCont.querySelectorAll('.avatar-opt');
        for (var i2 = 0; i2 < btns2.length; i2++) btns2[i2].classList.toggle('active', btns2[i2].getAttribute('data-emoji') === selectedAvatar);
      }
      if (newIdx === 2) renderList();
      if (newIdx === 3) renderAchievements();
      bindFormInputs();
      currentSpread = newIdx;
      updateDots();
      flipper.classList.remove('active');
      flipper.style.transition = 'none';
      flipper.style.transform = 'rotateY(0deg)';
      isFlipping = false;
      updateNav();
      startQuoteRotation();
      if (newIdx === 2) startLiveTick(); else stopLiveTick();
    }, 1200);
  }
}

document.addEventListener('click', function(e){
  if (e.target.closest('#langBtn')){ langMenu.classList.toggle('on'); return; }

  var langOpt = e.target.closest('#langMenu button');
  if (langOpt){
    var newLang = langOpt.getAttribute('data-lang');
    if (T[newLang]){
      LANG = newLang;
      try { localStorage.setItem(LANG_KEY, newLang); } catch(err){}
      document.getElementById('langLabel').textContent = T[LANG].langLabel;
      var btns = document.querySelectorAll('#langMenu button');
      for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-lang') === LANG);
      document.getElementById('openingSub').textContent = t('openingSub');
      document.getElementById('coverSub').textContent = t('coverSub');
      document.getElementById('coverPrompt').textContent = t('coverPrompt');
      SPREADS = buildSpreads();
      buildDots();
      if (currentSpread >= 0){
        renderSpread(currentSpread);
        updateDots();
        updateNav();
      }
    }
    langMenu.classList.remove('on');
    return;
  }
  if (!e.target.closest('#langMenu')) langMenu.classList.remove('on');

  var av = e.target.closest('.avatar-opt');
  if (av){
    var allAv = document.querySelectorAll('.avatar-opt');
    for (var a = 0; a < allAv.length; a++) allAv[a].classList.remove('active');
    av.classList.add('active');
    selectedAvatar = av.getAttribute('data-emoji');
    return;
  }
  var favBtn = e.target.closest('.fav-btn');
  if (favBtn){
    var key = favBtn.getAttribute('data-key');
    var entries = loadEntries();
    for (var k = 0; k < entries.length; k++) if (entries[k].key === key){ entries[k].fav = !entries[k].fav; break; }
    saveEntries(entries);
    renderList();
    return;
  }
  var avatarEl = e.target.closest('.avatar');
  if (avatarEl && avatarEl.getAttribute('data-key')){
    exportEntryAsImage(avatarEl.getAttribute('data-key'));
    return;
  }
  var todayLbl = e.target.closest('.today-label');
  if (todayLbl && todayLbl.getAttribute('data-key')){
    openCandle(todayLbl.getAttribute('data-key'));
    return;
  }
  var el = e.target.closest('[data-action]');
  if (el){
    var act = el.getAttribute('data-action');
    if (act === 'open') openBook();
    else if (act === 'next') flipTo(currentSpread + 1, 'fwd');
    else if (act === 'prev') flipTo(currentSpread - 1, 'bwd');
    else if (act === 'clear') clearHistory();
    else if (act === 'delete') deleteEntry(el.getAttribute('data-key'));
    else if (act === 'export') exportData();
    else if (act === 'import') importData();
    return;
  }
  var dot = e.target.closest('.dot');
  if (dot){
    var target = parseInt(dot.getAttribute('data-idx'), 10);
    if (target === currentSpread || isFlipping) return;
    if (currentSpread === -1) return;
    flipTo(target, target > currentSpread ? 'fwd' : 'bwd');
  }
});

document.addEventListener('keydown', function(e){
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') flipTo(currentSpread + 1, 'fwd');
  if (e.key === 'ArrowLeft') flipTo(currentSpread - 1, 'bwd');

    langMenu.classList.remove('on');
    document.getElementById('candleModal').classList.remove('on');
  }
});

/* ============ AUDIO ============ */
var audioCtx = null, soundOn = true, ambientOn = false;
function getAudio(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function buildReverb(ctx, seconds, decay){
  var rate = ctx.sampleRate, len = Math.floor(rate * seconds);
  var buf = ctx.createBuffer(2, len, rate);
  for (var ch = 0; ch < 2; ch++){
    var d = buf.getChannelData(ch);
    for (var i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, decay);
  }
  var conv = ctx.createConvolver(); conv.buffer = buf; return conv;
}
function startAmbient(){
  if (ambientOn) return;
  ambientOn = true;
  try {
    var ctx = getAudio();
    var now0 = ctx.currentTime;
    var master = ctx.createGain();
    master.gain.value = 0;
    master.gain.linearRampToValueAtTime(0.15, now0 + 8);
    master.connect(ctx.destination);
    var reverb = buildReverb(ctx, 6, 3.2);
    var wet = ctx.createGain(); wet.gain.value = 0.55;
    wet.connect(reverb); reverb.connect(ctx.destination);
    master.connect(wet);
    var drones = [55, 55.3, 55.7, 82.4];
    for (var i = 0; i < drones.length; i++){
      var osc = ctx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = drones[i];
      var g = ctx.createGain(); g.gain.value = i===3 ? 0.14 : 0.3;
      var bl = ctx.createOscillator(); bl.frequency.value = 0.04 + i*0.013;
      var blg = ctx.createGain(); blg.gain.value = g.gain.value * 0.35;
      bl.connect(blg); blg.connect(g.gain); bl.start();
      osc.connect(g); g.connect(master); osc.start();
    }
    var padFilter = ctx.createBiquadFilter();
    padFilter.type = 'lowpass'; padFilter.frequency.value = 420; padFilter.Q.value = 5;
    padFilter.connect(master);
    var padLFO = ctx.createOscillator(); padLFO.frequency.value = 0.038;
    var lfoG = ctx.createGain(); lfoG.gain.value = 260;
    padLFO.connect(lfoG); lfoG.connect(padFilter.frequency); padLFO.start();
    var pads = [110, 130.81, 164.81, 220, 261.63];
    for (var p = 0; p < pads.length; p++){
      var posc = ctx.createOscillator();
      posc.type = 'sawtooth'; posc.frequency.value = pads[p]; posc.detune.value = (p-2)*6;
      var pg = ctx.createGain(); pg.gain.value = 0.03 + (p===0 ? 0.02 : 0);
      posc.connect(pg); pg.connect(padFilter); posc.start();
    }
    var bells = [220, 261.63, 329.63, 392, 440, 523.25, 659.25, 783.99];
    var bIdx = 0;
    setInterval(function(){
      if (!soundOn || !ambientOn) return;
      if (Math.random() > 0.42) return;
      var t0 = ctx.currentTime;
      var bo = ctx.createOscillator();
      bo.type = 'sine'; bo.frequency.value = bells[(bIdx++) % bells.length];
      var tw = ctx.createOscillator();
      tw.type = 'sine'; tw.frequency.value = bo.frequency.value * 1.0015;
      var bg = ctx.createGain();
      bg.gain.setValueAtTime(0.0001, t0);
      bg.gain.exponentialRampToValueAtTime(0.1, t0 + 0.04);
      bg.gain.exponentialRampToValueAtTime(0.0001, t0 + 4.5);
      var twg = ctx.createGain(); twg.gain.value = 0.6;
      tw.connect(twg); twg.connect(bg);
      bo.connect(bg); bg.connect(master); bg.connect(reverb);
      bo.start(t0); bo.stop(t0 + 4.7);
      tw.start(t0); tw.stop(t0 + 4.7);
    }, 3800);
    setInterval(function(){
      if (!soundOn || !ambientOn) return;
      if (Math.random() > 0.35) return;
      var t0 = ctx.currentTime;
      var dur = 1.2;
      var len = Math.floor(ctx.sampleRate * dur);
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for (var q = 0; q < len; q++){
        var x = q/len;
        d[q] = (Math.random()*2-1) * Math.sin(x * Math.PI) * 0.5;
      }
      var src = ctx.createBufferSource(); src.buffer = buf;
      var filter = ctx.createBiquadFilter();
      filter.type = 'bandpass'; filter.frequency.value = 1200; filter.Q.value = 3;
      var g2 = ctx.createGain(); g2.gain.value = 0.025;
      src.connect(filter); filter.connect(g2);
      g2.connect(master); g2.connect(reverb);
      src.start(t0);
    }, 13000);
    setInterval(function(){
      if (!soundOn || !ambientOn) return;
      var t0 = ctx.currentTime;
      var so = ctx.createOscillator();
      so.type = 'sine';
      so.frequency.setValueAtTime(38, t0);
      so.frequency.exponentialRampToValueAtTime(22, t0 + 2.4);

      sg.gain.exponentialRampToValueAtTime(0.18, t0 + 0.35);
      sg.gain.exponentialRampToValueAtTime(0.0001, t0 + 3);
      so.connect(sg); sg.connect(master);
      so.start(t0); so.stop(t0 + 3.1);
    }, 9200);
  } catch(e){}
}

/* ============ VISUALIZER ============ */
(function(){
  var canvas = document.getElementById('viz');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W, H;
  function size(){ W = canvas.width = window.innerWidth; H = canvas.height = 60; }
  size(); window.addEventListener('resize', size);
  var phase = 0;
  function tick(){
    ctx.clearRect(0, 0, W, H);
    phase += 0.02;
    var bars = 60;
    var bw = W / bars;
    for (var i = 0; i < bars; i++){
      var v = Math.abs(Math.sin(phase + i*0.15)) * (0.4 + 0.6*Math.sin(phase*0.5 + i*0.08));
      var h = v * 40 + 4;
      var x = i * bw;
      var alpha = 0.15 + v * 0.4;
      var grad = ctx.createLinearGradient(0, H, 0, H - h);
      grad.addColorStop(0, 'rgba(120,20,20,' + alpha + ')');
      grad.addColorStop(1, 'rgba(220,60,60,' + (alpha * 0.4) + ')');
      ctx.fillStyle = grad;
      ctx.fillRect(x + 2, H - h, bw - 4, h);
    }
    requestAnimationFrame(tick);
  }
  tick();
})();

/* ============ CONFETTI ============ */
(function(){
  var canvas = document.getElementById('confetti');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W, H, parts = [];
  function size(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  size(); window.addEventListener('resize', size);
  var COLORS = ['#c1121f','#5a0a0a','#c9a227','#f4e8c8','#8b0000','#ff3b3b'];
  window._confettiBurst = function(){
    for (var i = 0; i < 90; i++){
      parts.push({
        x: W/2 + (Math.random()-.5)*280, y: H/2 + (Math.random()-.5)*140,
        vx: (Math.random()-.5)*12, vy: -Math.random()*10 - 3, g: 0.24,
        w: Math.random()*8 + 4, h: Math.random()*4 + 2,
        rot: Math.random()*Math.PI, vr: (Math.random()-.5)*0.32,
        color: COLORS[Math.floor(Math.random()*COLORS.length)], life: 1
      });
    }
  };
  function tick(){
    ctx.clearRect(0,0,W,H);
    for (var i = parts.length - 1; i >= 0; i--){
      var p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += p.vr; p.life -= 0.006;
      if (p.life <= 0 || p.y > H + 30){ parts.splice(i,1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    requestAnimationFrame(tick);
  }
  tick();
})();

(function(){
  var canvas = document.getElementById('embers');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W, H, parts = [];
  function size(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  size(); window.addEventListener('resize', size);
  for (var i = 0; i < 90; i++){
    parts.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+0.3,vy:Math.random()*0.45+0.08,drift:Math.random()*Math.PI*2,a:Math.random()*0.5+0.08});
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for (var i = 0; i < parts.length; i++){
      var p = parts[i];
      p.y -= p.vy; p.drift += 0.008; p.x += Math.sin(p.drift)*0.35;
      if (p.y < -10){ p.y = H + 10; p.x = Math.random()*W; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(220,70,70,' + p.a + ')';
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
})();

function bindRitualButton(btn){
  var fill = document.getElementById('ritualFill');
  var chargeId = null;
  var progress = 0;
  var holdTime = 1400;
  var startTime = 0;
  var fired = false;

  function startCharge(){
    if (btn.disabled) return;
    fired = false;
    progress = 0;
    startTime = Date.now();
    btn.classList.add('charging');
    if (fill) fill.style.width = '0%';
    chargeId = setInterval(function(){
      var elapsed = Date.now() - startTime;
      progress = Math.min(1, elapsed / holdTime);
      if (fill) fill.style.width = (progress * 100) + '%';
      if (progress >= 1){
        clearInterval(chargeId);
        chargeId = null;
        if (!fired){
          fired = true;
          btn.classList.remove('charging');
          if (fill) fill.style.width = '0%';
          commitWrite();
        }
      }
    }, 20);
  }
  function cancelCharge(){
    if (chargeId){ clearInterval(chargeId); chargeId = null; }
    if (!fired){
      btn.classList.remove('charging');
      if (fill) fill.style.width = '0%';
    }
  }
  btn.addEventListener('mousedown', startCharge);
  btn.addEventListener('mouseup', cancelCharge);
  btn.addEventListener('mouseleave', cancelCharge);
  btn.addEventListener('touchstart', function(e){ e.preventDefault(); startCharge(); }, {passive:false});
  btn.addEventListener('touchend', function(e){ e.preventDefault(); cancelCharge(); }, {passive:false});
}

function renderList(){
  var list = document.getElementById('historyList');
  var counter = document.getElementById('entryCounter');
  if (!list) return;
  var entries = loadEntries();
  var searchEl = document.getElementById('searchInput');
  var sortEl = document.getElementById('sortSelect');
  var searchTerm = searchEl ? searchEl.value.toLowerCase().trim() : '';
  var sortMode = sortEl ? sortEl.value : 'next';

  if (counter){
    counter.innerHTML = entries.length
      ? '— <b>' + entries.length + '</b> ' + (entries.length === 1 ? t('counterOne') : t('counterMany')) + ' —'
      : '— ' + t('counterNone') + ' —';
  }

  renderHero();

  if (!entries.length){
    list.innerHTML = '<div class="history-empty">' + t('empty') + '</div>';
    return;
  }

  var filtered = entries.filter(function(e){ return e.name.toLowerCase().indexOf(searchTerm) !== -1; });

  filtered.sort(function(a, b){
    if (sortMode === 'fav'){
      var fa = a.fav ? 1 : 0, fb = b.fav ? 1 : 0;
      if (fa !== fb) return fb - fa;
    }
    if (sortMode === 'name') return a.name.localeCompare(b.name);
    if (sortMode === 'recent') return (b.time||0) - (a.time||0);
    if (sortMode === 'age'){
      var ya = +a.bday.split('-')[0], yb = +b.bday.split('-')[0];
      return ya - yb;
    }
    var ia = getNextBirthdayInfo(a.bday), ib = getNextBirthdayInfo(b.bday);
    if (ia.isToday && !ib.isToday) return -1;
    if (ib.isToday && !ia.isToday) return 1;
    return (ia.days*86400+ia.hours*3600+ia.minutes*60+ia.seconds) - (ib.days*86400+ib.hours*3600+ib.minutes*60+ib.seconds);
  });

  if (!filtered.length){
    list.innerHTML = '<div class="history-empty">' + t('empty') + '</div>';
    return;
  }

  var pad = function(n){ return String(n).length < 2 ? '0' + n : String(n); };
  var html = '';
  for (var i = 0; i < filtered.length; i++){
    var e = filtered[i];
    var info = getNextBirthdayInfo(e.bday);
    var av = e.avatar || '🧑';
    var parts = e.bday.split('-').map(Number);
    var yy = parts[0], mm = parts[1], dd = parts[2];
    var wz = getWesternZodiac(mm, dd);
    var cz = getChineseZodiac(yy);
    var bDate = new Date(yy, mm-1, dd);
    var moon = getMoonEmojiAndName(getMoonPhase(bDate));
    var alive = daysAlive(e.bday);
    var aliveSec = ageInSeconds(e.bday).toLocaleString();
    var favCls = e.fav ? 'on' : '';
    var favChar = e.fav ? '★' : '☆';
    var noteHtml = e.note ? '<div class="note">"' + escapeHtml(e.note) + '"</div>' : '';
    var constellationSvg = buildConstellationSVG(wz.n);

    if (info.isToday){
      html += '<div class="entry today">' +
        '<div class="avatar" data-key="' + escapeHtml(e.key) + '" title="Tap to seal as card">' + av + '</div>' +
        '<div class="info">' +
          '<div class="nm">' + escapeHtml(e.name) +
            ' <button type="button" class="fav-btn ' + favCls + '" data-key="' + escapeHtml(e.key) + '" title="Favorite">' + favChar + '</button>' +
          '</div>' +
          '<div class="bday">' + escapeHtml(formatDate(e.bday)) + ' · ' + t('turns') + ' <b>' + info.ageTurning + '</b>' + constellationSvg + '</div>' +
          '<div class="zodiac"><span class="sign">' + wz.s + '</span>' + wz.n + ' · ' + cz + '</div>' +
          '<div class="moon">' + moon.emoji + ' ' + moon.name + '</div>' +
          '<div class="age">' + alive.toLocaleString() + ' ' + t('daysAlive') + ' · <b>' + aliveSec + '</b> ' + t('secondsAlive') + '</div>' +
          noteHtml +
        '</div>' +
        '<div class="today-label" data-key="' + escapeHtml(e.key) + '" title="Blow the candle">🎉 ' + t('todaysBirthday') + '</div>' +
        '<button type="button" class="del" data-action="delete" data-key="' + escapeHtml(e.key) + '" title="Remove">×</button>' +
      '</div>';
    } else {
      html += '<div class="entry" data-bday="' + escapeHtml(e.bday) + '">' +
        '<div class="avatar" data-key="' + escapeHtml(e.key) + '" title="Tap to seal as card">' + av + '</div>' +
        '<div class="info">' +
          '<div class="nm">' + escapeHtml(e.name) +
            ' <button type="button" class="fav-btn ' + favCls + '" data-key="' + escapeHtml(e.key) + '" title="Favorite">' + favChar + '</button>' +
          '</div>' +
          '<div class="bday">' + escapeHtml(formatDate(e.bday)) + ' · ' + t('turns') + ' <b>' + info.ageTurning + '</b>' + constellationSvg + '</div>' +
          '<div class="zodiac"><span class="sign">' + wz.s + '</span>' + wz.n + ' · ' + cz + '</div>' +
          '<div class="moon">' + moon.emoji + ' ' + moon.name + '</div>' +
          '<div class="age">' + alive.toLocaleString() + ' ' + t('daysAlive') + ' · <b data-age-sec>' + aliveSec + '</b> ' + t('secondsAlive') + '</div>' +
          noteHtml +
        '</div>' +
        '<div class="timer">' +
          '<div class="tcell"><span class="num" data-u="d">' + info.days + '</span><span class="unit">d</span></div>' +
          '<span class="sep">:</span>' +
          '<div class="tcell"><span class="num" data-u="h">' + pad(info.hours) + '</span><span class="unit">h</span></div>' +
          '<span class="sep">:</span>' +
          '<div class="tcell"><span class="num" data-u="m">' + pad(info.minutes) + '</span><span class="unit">m</span></div>' +
          '<span class="sep">:</span>' +
          '<div class="tcell"><span class="num" data-u="s">' + pad(info.seconds) + '</span><span class="unit">s</span></div>' +
        '</div>' +
        '<button type="button" class="del" data-action="delete" data-key="' + escapeHtml(e.key) + '" title="Remove">×</button>' +
      '</div>';
    }
  }
  list.innerHTML = html;

  if (!liveTickId) startLiveTick();
}

/* ============ LIVE TICK ============ */
function startLiveTick(){
  stopLiveTick();
  liveTickId = setInterval(function(){
    var listEl = document.getElementById('historyList');
    if (!listEl){ stopLiveTick(); return; }
    var rows = listEl.querySelectorAll('.entry[data-bday]');
    var pad = function(n){ return String(n).length < 2 ? '0' + n : String(n); };
    var needRerender = false;
    for (var i = 0; i < rows.length; i++){
      var bday = rows[i].getAttribute('data-bday');
      var info = getNextBirthdayInfo(bday);
      if (info.isToday){ needRerender = true; continue; }
      var cells = rows[i].querySelectorAll('.timer .tcell .num');
      if (cells.length === 4){
        cells[0].textContent = info.days;
        cells[1].textContent = pad(info.hours);
        cells[2].textContent = pad(info.minutes);
        cells[3].textContent = pad(info.seconds);
      }
      var ageEl = rows[i].querySelector('[data-age-sec]');
      if (ageEl) ageEl.textContent = ageInSeconds(bday).toLocaleString();
    }
    var heroTimer = document.getElementById('heroTimer');
    if (heroTimer && rows.length){
      var hInfo = getNextBirthdayInfo(rows[0].getAttribute('data-bday'));
      var hD = heroTimer.querySelector('[data-h="d"]');
      var hH = heroTimer.querySelector('[data-h="h"]');
      var hM = heroTimer.querySelector('[data-h="m"]');
      var hS = heroTimer.querySelector('[data-h="s"]');
      if (hD) hD.textContent = hInfo.days;
      if (hH) hH.textContent = pad(hInfo.hours);
      if (hM) hM.textContent = pad(hInfo.minutes);
      if (hS) hS.textContent = pad(hInfo.seconds);
    }
    if (needRerender){
      renderList();
      if (soundOn) chime();
      if (window._confettiBurst) window._confettiBurst();
    }
  }, 1000);
}
function stopLiveTick(){
  if (liveTickId){ clearInterval(liveTickId); liveTickId = null; }
}

/* ============ QUOTE ROTATION ============ */
function startQuoteRotation(){
  if (quoteId) clearInterval(quoteId);
  quoteId = setInterval(function(){
    var q = document.getElementById('rotatingQuote') || document.getElementById('shiniRotQuote');
    if (!q) return;
    q.style.opacity = '0';
    setTimeout(function(){
      var shiniQuotes = [
        t('ryukQuote'),
        '"' + t('shiniRule3') + '"',
        '"' + t('r3') + '"',
        '"The ink remembers what the world forgets."',
        '"Time is the only currency that never runs out — until it does."',
        '"Do you hear the pages turning?"'
      ];
      q.textContent = shiniQuotes[Math.floor(Math.random()*shiniQuotes.length)];
      q.style.opacity = '1';
    }, 600);
  }, 8000);
}

/* ============ WHISPERS ============ */
function startWhispers(){
  if (whisperId) clearInterval(whisperId);
  whisperId = setInterval(function(){
    if (Math.random() > 0.35) return;
    var w = document.createElement('div');
    w.className = 'whisper';
    w.textContent = randomWhisper();
    w.style.left = (10 + Math.random() * 70) + '%';
    w.style.top = (15 + Math.random() * 70) + '%';
    w.style.transform = 'rotate(' + ((Math.random() - .5) * 20) + 'deg)';
    document.body.appendChild(w);
    setTimeout(function(){ w.style.opacity = '1'; }, 50);
    setTimeout(function(){ w.style.opacity = '0'; }, 4000);
    setTimeout(function(){ if (w.parentNode) w.parentNode.removeChild(w); }, 6500);
  }, 12000);
}

/* ============ UPCOMING BIRTHDAY NOTIFICATION ============ */
function checkUpcomingBirthdays(){
  var entries = loadEntries();
  if (!entries.length) return;
  var upcoming = [];
  for (var i = 0; i < entries.length; i++){
    var info = getNextBirthdayInfo(entries[i].bday);
    if (info.days === 0) upcoming.unshift({ name: entries[i].name, when: 'today', days: 0 });
    else if (info.days <= 7) upcoming.push({ name: entries[i].name, when: 'in ' + info.days + ' days', days: info.days });
  }
  if (!upcoming.length) return;
  var msg;
  if (upcoming.length === 1) msg = upcoming[0].name + ' — ' + upcoming[0].when;
  else if (upcoming.length === 2) msg = upcoming[0].name + ' & ' + upcoming[1].name;
  else msg = upcoming.length + ' birthdays this week';
  showNotify(msg);
  if (soundOn && upcoming[0].days === 0) chime();
}

/* ============ CANDLE MODAL ============ */
function openCandle(key){
  var entries = loadEntries();
  var found = null;
  for (var i = 0; i < entries.length; i++) if (entries[i].key === key){ found = entries[i]; break; }
  if (!found) return;
  var info = getNextBirthdayInfo(found.bday);
  document.getElementById('candleName').textContent = found.name;
  document.getElementById('candleSub').textContent = t('candleSub') + ' · ' + t('turns') + ' ' + info.ageTurning;
  document.getElementById('candleModal').classList.add('on');
  var flame = document.getElementById('candleFlame');
  var smoke = document.getElementById('candleSmoke');
  flame.classList.remove('blown');
  smoke.classList.remove('on');
  document.getElementById('candleHint').textContent = t('candleHint');

  var blown = false;
  function blow(e){
    if (e) e.stopPropagation();
    if (blown) return;
    blown = true;
    flame.classList.add('blown');
    smoke.classList.add('on');
    candleBlowSound();
    if (window._confettiBurst) window._confettiBurst();
    setTimeout(function(){ if (soundOn) chime(); }, 300);
    document.getElementById('candleHint').textContent = t('candleDone');
    setTimeout(function(){
      document.getElementById('candleModal').classList.remove('on');
      if (window._confettiBurst) window._confettiBurst();
    }, 2400);
  }
  var wrap = document.getElementById('candleWrap');
  wrap.onclick = blow;
  document.getElementById('candleClose').onclick = function(e){
    e.stopPropagation();
    document.getElementById('candleModal').classList.remove('on');
  };
}

/* ============ EXPORT AS IMAGE ============ */
function exportEntryAsImage(key){
  var entries = loadEntries();
  var e = null;
  for (var i = 0; i < entries.length; i++) if (entries[i].key === key){ e = entries[i]; break; }
  if (!e) return;

  var parts = e.bday.split('-').map(Number);
  var yy = parts[0], mm = parts[1], dd = parts[2];
  var wz = getWesternZodiac(mm, dd);
  var cz = getChineseZodiac(yy);
  var bDate = new Date(yy, mm-1, dd);
  var moon = getMoonEmojiAndName(getMoonPhase(bDate));
  var info = getNextBirthdayInfo(e.bday);
  var alive = daysAlive(e.bday);

  var W = 600, H = 800;
  var c = document.createElement('canvas');
  c.width = W; c.height = H;
  var g = c.getContext('2d');

  var bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1a0808');
  bg.addColorStop(1, '#0a0202');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  g.strokeStyle = '#c1121f';
  g.lineWidth = 2;
  g.strokeRect(20, 20, W-40, H-40);
  g.strokeStyle = 'rgba(200,20,20,.3)';
  g.strokeRect(30, 30, W-60, H-60);

  g.font = 'bold 22px Cinzel, serif';
  g.fillStyle = '#c9a227';
  g.textAlign = 'center';
  g.fillText('DEATH NOTE', W/2, 80);
  g.font = 'italic 12px Cormorant Garamond, serif';
  g.fillStyle = '#8a6a3a';
  g.fillText('· Birthday Edition ·', W/2, 105);

  var cx = W/2, cy = 200, r = 60;
  var grad = g.createRadialGradient(cx-20, cy-20, 5, cx, cy, r);
  grad.addColorStop(0, '#7a1a1a');
  grad.addColorStop(1, '#3a0a0a');
  g.beginPath();
  g.arc(cx, cy, r, 0, Math.PI*2);
  g.fillStyle = grad;
  g.fill();
  g.strokeStyle = '#c1121f';
  g.lineWidth = 2;
  g.stroke();
  g.font = '48px serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillStyle = '#fff';
  g.fillText(e.avatar || '🧑', cx, cy + 4);

  g.textBaseline = 'alphabetic';
  g.font = 'bold 44px Caveat, cursive';
  g.fillStyle = '#f4e8c8';
  g.textAlign = 'center';
  g.fillText(e.name, W/2, 320);

  g.font = '16px Cinzel, serif';
  g.fillStyle = '#a88a5a';
  g.fillText('born ' + formatDate(e.bday), W/2, 355);

  var stats = [
    ['Zodiac', wz.s + ' ' + wz.n],
    ['Chinese', cz],
    ['Moon', moon.emoji + ' ' + moon.name],
    ['Age', alive.toLocaleString() + ' days'],
    ['Turns', String(info.ageTurning)],
    ['Next', info.isToday ? 'TODAY' : 'in ' + info.days + ' days']
  ];
  var startX = 80, startY = 420, colW = 440, rowH = 50;
  g.textAlign = 'left';
  for (var i = 0; i < stats.length; i++){
    var row = Math.floor(i/2);
    var col = i % 2;
    var x = startX + col * (colW/2);
    var y = startY + row * rowH;
    g.font = '10px Cinzel, serif';
    g.fillStyle = '#7a5a3a';
    g.fillText(stats[i][0].toUpperCase(), x, y);
    g.font = 'bold 18px Cinzel, serif';
    g.fillStyle = '#f4e8c8';
    g.fillText(stats[i][1], x, y + 22);
  }

  if (e.note){
    g.font = 'italic 15px Cormorant Garamond, serif';
    g.fillStyle = '#c9a08a';
    g.textAlign = 'center';
    var wrapped = wrapText(g, '"' + e.note + '"', W-140);
    for (var wi = 0; wi < wrapped.length; wi++){
      g.fillText(wrapped[wi], W/2, 620 + wi * 22);
    }
  }

  g.font = '10px Cinzel, serif';
  g.fillStyle = '#5a4a3a';
  g.textAlign = 'center';
  g.fillText('· SEALED IN THE DEATH NOTE ·', W/2, H - 50);

  try {
    var url = c.toDataURL('image/png');
    var a = document.createElement('a');
    a.href = url;
    a.download = e.name.replace(/[^a-z0-9]/gi, '_') + '_deatnote_card.png';
    document.body.appendChild(a); a.click(); a.remove();
    showToast('Card sealed: ' + e.name);
    deathBell();
  } catch(err){
    showToast('Could not seal the card', true);
  }
}
function wrapText(ctx, text, maxW){
  var words = text.split(' ');
  var lines = [], line = '';
  for (var i = 0; i < words.length; i++){
    var test = line + words[i] + ' ';
    if (ctx.measureText(test).width > maxW && line){
      lines.push(line.trim());
      line = words[i] + ' ';
    } else line = test;
  }
  if (line) lines.push(line.trim());
  return lines;
}

/* ============ DELETE / CLEAR / EXPORT / IMPORT ============ */
function deleteEntry(key){
  var entries = loadEntries();
  var out = [];
  for (var i = 0; i < entries.length; i++) if (entries[i].key !== key) out.push(entries[i]);
  saveEntries(out);
  renderList();
  renderAchievements();
}
function clearHistory(){
  if (confirm(t('confirmClear'))){
    memoryStore = [];
    if (storageWorks){ try { localStorage.removeItem(STORAGE_KEY); } catch(e){} }
    renderList();
    renderAchievements();
    showToast(t('pagesClean'));
  }
}
function exportData(){
  var entries = loadEntries();
  var blob = new Blob([JSON.stringify({version:8, entries: entries}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'deathnote-birthdays-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  showToast('Exported ' + entries.length + ' entries');
}
function importData(){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = function(){
    var file = inp.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var data = JSON.parse(reader.result);
        var incoming = Array.isArray(data) ? data : (data.entries || []);
        var current = loadEntries();
        var merged = current.slice();
        var added = 0;
        for (var i = 0; i < incoming.length; i++){
          var e = incoming[i];
          if (!e || !e.name || !e.bday) continue;
          if (!isValidDateStr(e.bday)) continue;
          var dup = false;
          for (var j = 0; j < merged.length; j++){
            if (merged[j].key === e.key || (merged[j].name === e.name && merged[j].bday === e.bday)){ dup = true; break; }
          }
          if (!dup){
            merged.push({
              key: e.key || (Date.now() + '-' + Math.random().toString(36).slice(2,7)),
              name: String(e.name).slice(0,32),
              bday: e.bday,
              avatar: e.avatar || '🧑',
              note: (e.note || '').slice(0,140),
              time: e.time || Date.now(),
              fav: !!e.fav
            });
            added++;
          }
        }
        saveEntries(merged);
        renderList();
        renderAchievements();
        showToast('Imported ' + added + ' new entries');
      } catch(err){
        showToast('Could not read the file', true);
      }
    };
    reader.readAsText(file);
  };
  inp.click();
}
